[project]
name = "rahatnet"
version = "0.1.0"
description = "RahatNet: flood-relief logistics agent swarm (Assam)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "networkx>=3.3",
    "shapely>=2.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
