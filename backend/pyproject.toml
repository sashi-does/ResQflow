[project]
name = "rahatnet"
version = "0.1.0"
description = "RahatNet: flood-relief logistics agent swarm (Assam)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "networkx>=3.3",
    "shapely>=2.0",
    "httpx>=0.27",
    "anthropic>=2.10.0",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
